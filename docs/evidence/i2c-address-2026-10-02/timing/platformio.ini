[env]
platform = https://github.com/pioarduino/platform-espressif32.git#55.03.38-1
framework = arduino
build_flags = -DARDUINO_USB_CDC_ON_BOOT=0
lib_deps =
  sensirion/Sensirion Core@0.7.3
  https://github.com/Sensirion/arduino-i2c-scd4x.git#fd169d39a3dd342ba05feef92d69c36fb3a340ee
[env:s3]
board = esp32-s3-devkitc-1
[env:c3]
board = esp32-c3-devkitm-1
[env:c6]
board = esp32-c6-devkitc-1
[env:heavy]
board = esp32-s3-devkitc-1
build_flags = ${env.build_flags} -DI2C_HEAVY
